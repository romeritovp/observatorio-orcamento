[project]
name = "orcamento-estados"
version = "0.1.0"
description = "Análises de orçamentos estaduais brasileiros com dados públicos"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "pdfplumber>=0.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
